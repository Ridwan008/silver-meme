name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # =========================================================
      # 1. Configure Windows Remote Desktop
      # =========================================================
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Write-Host "Configuring Remote Desktop..."

          # Enable Remote Desktop
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force

          # Disable Network Level Authentication
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force

          # Set RDP Security Layer
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 0 -Force

          # Remove existing firewall rule if present
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow RDP port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force

          Write-Host "Remote Desktop configuration completed."


      # =========================================================
      # 2. Create RDP User
      # =========================================================
      - name: Create RDP User with Secure Password
        shell: powershell
        run: |
          Write-Host "Creating RDP user..."

          # Character sets
          $upper = [char[]](65..90)
          $lower = [char[]](97..122)
          $number = [char[]](48..57)
          $special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))

          # Generate password
          $passwordChars = @()
          $passwordChars += $upper | Get-Random -Count 4
          $passwordChars += $lower | Get-Random -Count 4
          $passwordChars += $number | Get-Random -Count 4
          $passwordChars += $special | Get-Random -Count 4

          $password = -join ($passwordChars | Sort-Object { Get-Random })

          # Convert password to SecureString
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          # Remove old user if it exists
          $existingUser = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($existingUser) {
              Remove-LocalUser -Name "RDP"
          }

          # Create user
          New-LocalUser -Name "RDP" -Password $securePassword -AccountNeverExpires

          # Add user to Administrators
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"

          # Add user to Remote Desktop Users
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          # Verify user
          $userCheck = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if (-not $userCheck) {
              Write-Error "RDP user creation failed."
              exit 1
          }

          # Save credentials for later steps
          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "RDP user created successfully."


      # =========================================================
      # 3. Install Tailscale
      # =========================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "Installing Tailscale..."

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          Write-Host "Tailscale installation completed."


      # =========================================================
      # 4. Connect to Tailscale
      # =========================================================
      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          Write-Host "Connecting to Tailscale..."

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
              Write-Error "Tailscale executable not found."
              exit 1
          }

          # Connect Tailscale
          & $tsExe up `
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Write-Host "Waiting for Tailscale IP..."

          $tsIP = $null

          for ($i = 0; $i -lt 20; $i++) {

              $tsIP = (& $tsExe ip -4 | Select-Object -First 1).Trim()

              if ($tsIP) {
                  break
              }

              Write-Host "Waiting... attempt $($i + 1)/20"
              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          Write-Host "Tailscale IPv4: $tsIP"

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV


      # =========================================================
      # 5. Verify RDP
      # =========================================================
      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Checking RDP..."

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $result.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not accessible."
              exit 1
          }

          Write-Host "RDP port 3389 is accessible."


      # =========================================================
      # 6. Display Connection Information
      # =========================================================
      - name: Display RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RDP ACCESS INFORMATION"
          Write-Host "========================================"
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : $env:RDP_USERNAME"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host "Port     : 3389"
          Write-Host "========================================"
          Write-Host ""


      # =========================================================
      # 7. Keep Runner Alive
      # =========================================================
      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "RDP is active."
          Write-Host "Keeping the runner alive..."

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
